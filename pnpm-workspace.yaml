packages:
  - shared
  - native-host
  - extension

# Security fixes for dev-only tooling (none of these ship in the store zip or the host package):
# - node-forge: wxt > web-ext > @devicefarmer/adbkit pins a vulnerable 1.x (GHSA-4487-j8r4-4g2f and others)
# - minimatch: eslint's config-array needs >= 11.0.1 (globparts denial of service)
overrides:
  node-forge: ^1.4.1
  minimatch@<11.0.1: ^11.0.1
